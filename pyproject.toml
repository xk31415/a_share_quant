[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-quant"
version = "0.1.0"
description = "A-share quantitative research and backtesting framework (research infrastructure first)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyarrow>=14.0",  # 仅在使用 parquet 数据文件时需要
]
# 数据源适配（scripts/build_dataset.py 按需 import，缺了不影响回测）
data = [
    "baostock>=0.8",  # 免费，含退市股与逐日 ST/停牌，推荐
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
