# =====================================================================
# 实盘/仿真自动化配置（live_auto.py 读取）
# =====================================================================

# --- 解释器（绝对路径，避免 PATH 被谁改了就跑错）---
# 一个解释器跑全部：数据更新 + 信号 + 对账 + 掘金交易（gm SDK）。
# 必须是装了 gm 与 pandas 的 3.12——没有可分离的"交易解释器"了。
python_data:  C:\Users\Administrator\AppData\Local\Programs\Python\Python312\python.exe

# --- 路径（相对项目根）---
data_dir:  data/processed_2025_2026
holdings:  live/holdings.csv
fills_dir: fills
out_dir:   live
sample:    live/sample.json
log_dir:   live/logs

# --- 策略 ---
# equal_weight = 等权 50 只，季度调仓（1/4/7/10）
# hype_watch   = 观察池（日频，题材触发，pool_size 只）
strategy: hype_watch
position: 0.5
ignore_quarter: false      # true = 非季度月也强制调仓
themes: null               # hype_watch 用：题材成员 CSV 路径（不给则用行业代理）

# --- 下单安全 ---
auto_trade: true          # true = 真实下单（仿真账户）。false = 只算不下
order_type: limit          # limit = 按委托价挂单；market = 市价
max_orders: 200            # 超过这个笔数拒绝下单（防呆）

# 执行日定价的滑点：挂单价 = 执行日实时价 ×(1±此值)，与 backtest/costs.py 的
# slippage_rate 同义。2026-10-28 之前挂的是信号日收盘价，实测 3 笔里
# 2 笔真实买不到、1 笔多付 3%。
slippage_rate: 0.0005

# 下单时刻（本地时间）。计划任务 09:29 启动，stage_trade 跑完拉持仓与算信号后等到这里。
# 为什么不是开盘那一秒：09:15-09:25 是集合竞价的申报与撮合阶段（09:25 才出开盘价），
# 09:30 起连续竞价。等到 09:30:05 才有真实价格可挂，与回测的 t+1 开盘价同口径。
order_time: "09:30:05"
