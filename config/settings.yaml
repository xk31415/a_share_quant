# =====================================================================
# 全局回测设置
# 交易规则与数据源一律在此配置；禁止硬编码进策略代码。
# =====================================================================

backtest:
  start_date: "2018-01-01"     # 回测开始日（会被实际数据覆盖范围裁剪）
  end_date: "2023-12-31"       # 回测结束日
  benchmark: "000852"          # 基准：沪深300（缺失时不对比）
                               # 评估等权策略时只跟指数比不够——同口径下
                               # "全宇宙等权"月频是 9.84%/年（2020-2024），任何等权
                               # 策略打不过它就等于没做选择。日频口径 8.72% 含再平衡
                               # 红利，不要拿它当及格线。见 reports/research.md §2。
                               # 换基准：--benchmark 000852（中证1000）
                               # 注意基准是价格指数，不含分红，约低估 1~1.5pp/年
  initial_capital: 1000000     # 初始资金（元）
  rebalance_frequency: "M"     # 调仓频率：D=每日 / W=每周 / M=每月（取周期内最后交易日为信号日）
  execution_price: "open"      # t 日收盘生成信号，t+1 以该价格撮合（open=开盘价）

portfolio:
  max_positions: 50            # 最大持仓数量（基准用 50：单只 2 万，最低佣金 5 元约 2.5bp）
  max_weight_per_stock: 0.10   # 单只股票最大权重
  cash_buffer: 0.01            # 建仓预留现金比例（覆盖佣金/印花税/滑点，避免末位买单被饿死）

costs:
  commission_rate: 0.00025     # 券商佣金（双边，比例）
  commission_min: 5.0          # 单笔最低佣金（元）
  stamp_duty_rate: 0.0005      # 印花税（仅卖出；2023-08-28 起为 0.05%）
  slippage_rate: 0.0005        # 滑点（按参考价向不利方向偏移的比例）

market_rules:
  consider_limit_up_down: true # 是否模拟涨跌停无法成交（bars 必须逐行提供 limit_up/limit_down，否则启动即报错）
  consider_suspension: true    # 是否模拟停牌无法成交（以 status 表为权威来源）
  lot_size: 100                # A 股一手股数
  max_participation_rate: 0.10 # 单笔成交不超过「成交日全日成交量」的比例（0 = 不限制）。
                               # 口径说明：这是事后容量代理，不是开盘时点可成交量——
                               # 开盘时拿不到全日量，只能用它做上限估计。
                               # 注意：库默认 0（关闭），只有本文件与基线脚本会开。

# 数据目录由命令行 --data-dir 指定（默认 data/interim/synthetic）。
# 接入真实数据：--data-dir data/processed

# ---------------------------------------------------------------------
# 炒作苗头 + 观察池（paper / 观察仿真）
# 只给 --strategy hype_watch 用。不接入 live_signal / live_auto。
# 参数是先验，不按收益搜索。没有已验证收益，不要写进研究判定。
# 说明见 reports/hype_watch.md。
# ---------------------------------------------------------------------
hype_watch:
  paper_only: true
  input_mode: auto          # auto：有 --watchlist 走晨报，否则纯规则；也可写 rules / csv
  pool_size: 3              # 观察池只数（1..5）
  max_themes: 3             # 主线题材条数（1..3）
  min_limitup_count: 3      # 题材内收盘涨停家数门槛（主板+创业板、非 ST、非停牌）
  min_theme_excess: 0.01    # 题材等权日收益 − 基准日收益；null 表示不设这道门槛
  min_theme_members: 3      # 能算出后复权日收益的成分至少这么多，否则不触发
  observe_horizons: [1, 3, 5]  # 事后观察窗口（交易日），不参与目标权重
  position_mode: equal      # equal=入选标的平分 gross_exposure；fixed=每只 fixed_weight
  gross_exposure: 1.0
  fixed_weight: 0.20
  execution_price: open     # 信号日收盘决定，下一交易日按这一列撮合（open 或 close）
  rebalance_frequency: D    # 冷静期按信号日计数；不是 D 时 N 日不等于 N 个交易日
  benchmark: "000852"
  limitup_abs_tol: 0.0001   # close + tol >= limit_up 视为涨停（原始价，单位元）
  csv_require_trigger: true # false = 只回放晨报名单，涨停家数与超额门槛不生效
  circuit_breaker:
    enabled: true
    lookback: 20            # 滚动交易日峰值，不是从回测起点起的历史高点
    max_drawdown: -0.08     # 峰值回撤达到或深于 -8% 则空仓；-8% 写成 -0.08
    cooldown_days: 5        # 含触发当日的信号日个数
  costs:
    commission_rate: 0.00025
    commission_min: 5.0     # 小单上最低佣金会高于 0.10% 的比例部分
    slippage_rate: 0.00075  # 与佣金合计，单边比例摩擦 0.10%
    stamp_duty_rate: 0.0005 # 仅卖出，不计入上面的 0.10%

# 热点 + 龙头（研究规则，不接入实盘）。数字是先验，不是按收益搜索的结果。
# 5 个行业 × 2 只 = 10 只，等权正好落在上面的单票上限 10% 上。
# 入选少于 10 只时，组合层把超出 10% 的权重留成现金，不重新归一。
# 调仓是日频按需，不读取上面的 rebalance_frequency（月频只给其它策略用）。
# 每个交易日收盘重算目标；目标名单和权重与上次提交的一致、且持股名单已经跟上，则不下单。
# 实盘冻结样本的季度调仓仍是另一条链路。
hotspot_dragonhead:
  rebalance: daily_on_change  # 日频评估，按需调仓
  top_k: 5                  # 热点行业数
  top_m: 2                  # 每个热点行业的龙头只数
  window: 20                # 行业等权收益与相对强弱的回看交易日
  amount_window: 20         # 日均成交额回看交易日
  min_industry_members: 3   # 行业内有效收益样本少于此数则不参与排名
