# =====================================================================
# 全局回测设置
# 交易规则与数据源一律在此配置；禁止硬编码进策略代码。
# =====================================================================

backtest:
  start_date: "2018-01-01"     # 回测开始日（会被实际数据覆盖范围裁剪）
  end_date: "2023-12-31"       # 回测结束日
  benchmark: "000300"          # 基准：沪深300（缺失时不对比）
                               # 评估等权策略时只跟指数比不够——同口径下
                               # "全宇宙等权"月频是 9.84%/年（2020-2024），任何等权
                               # 策略打不过它就等于没做选择。日频口径 8.72% 含再平衡
                               # 红利，不要拿它当及格线。见 reports/research.md §2。
                               # 换基准：--benchmark 000852（中证1000）
                               # 注意基准是价格指数，不含分红，约低估 1~1.5pp/年
  initial_capital: 1000000     # 初始资金（元）
  rebalance_frequency: "M"     # 调仓频率：D=每日 / W=每周 / M=每月（取周期内最后交易日为信号日）
  execution_price: "open"      # t 日收盘生成信号，t+1 以该价格撮合（open=开盘价）

portfolio:
  max_positions: 50            # 最大持仓数量（基准用 50：单只 2 万，最低佣金 5 元约 2.5bp）
  max_weight_per_stock: 0.10   # 单只股票最大权重
  cash_buffer: 0.01            # 建仓预留现金比例（覆盖佣金/印花税/滑点，避免末位买单被饿死）

costs:
  commission_rate: 0.00025     # 券商佣金（双边，比例）
  commission_min: 5.0          # 单笔最低佣金（元）
  stamp_duty_rate: 0.0005      # 印花税（仅卖出；2023-08-28 起为 0.05%）
  slippage_rate: 0.0005        # 滑点（按参考价向不利方向偏移的比例）

market_rules:
  consider_limit_up_down: true # 是否模拟涨跌停无法成交（bars 必须逐行提供 limit_up/limit_down，否则启动即报错）
  consider_suspension: true    # 是否模拟停牌无法成交（以 status 表为权威来源）
  lot_size: 100                # A 股一手股数
  max_participation_rate: 0.10 # 单笔成交不超过「成交日全日成交量」的比例（0 = 不限制）。
                               # 口径说明：这是事后容量代理，不是开盘时点可成交量——
                               # 开盘时拿不到全日量，只能用它做上限估计。
                               # 注意：库默认 0（关闭），只有本文件与基线脚本会开。

# 数据目录由命令行 --data-dir 指定（默认 data/interim/synthetic）。
# 接入真实数据：--data-dir data/processed
